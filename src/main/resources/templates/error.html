<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página no encontrada')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="shell section section--narrow">
    <div class="panel empty-state">
        <p class="eyebrow" th:text="'Error ' + ${status}">Error 404</p>
        <h1>No encontramos esta mesa</h1>
        <p class="lead">La página que buscas no existe o cambió de lugar. Vuelve al inicio para reservar o gestionar
            tu reserva.</p>
        <a class="btn btn--primary" th:href="@{/}">Volver al inicio</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
