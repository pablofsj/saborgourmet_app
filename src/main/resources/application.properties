spring.application.name=saborgourmet_app
server.port=8080

# Base de datos H2 persistente en la carpeta data/ (se crea sola)
spring.datasource.url=jdbc:h2:file:./data/saborgourmet;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola de base de datos para revisar los datos en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
